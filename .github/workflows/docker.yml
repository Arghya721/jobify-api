name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build and Push Docker Image'
        required: true
        default: true
        type: boolean
      deploy_image:
        description: 'Deploy to Cloud Run'
        required: true
        default: true
        type: boolean

env:
  PROJECT_ID: job-notifier-478915
  REGION: asia-south1
  REGISTRY_HOSTNAME: asia-south1-docker.pkg.dev
  SERVICE_NAME: jobify-api
  IMAGE_NAME: jobify-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'
              - '.github/workflows/docker.yml'

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.SERVICE_ACCOUNT_JSON }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        if: (github.event_name == 'push' && steps.filter.outputs.backend == 'true') || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOSTNAME }}

      - name: Build and Push Docker Image
        if: (github.event_name == 'push' && steps.filter.outputs.backend == 'true') || (github.event_name == 'workflow_dispatch' && inputs.build_image == true)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/jobify-api/${{ env.IMAGE_NAME }}:latest

      - name: Prepare Secrets
        if: (github.event_name == 'push' && steps.filter.outputs.backend == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_image == true)
        run: |
          # Inject secrets into .env file
          echo "${{ secrets.JOBIFY_API_ENV }}" > .env
          
          # Option 1 (Preferred): Convert to YAML for Cloud Run Runtime Env Vars
          # This keeps secrets out of the image build
          # We use regex to quote the values to prevent boolean parsing errors (e.g. true -> "true")
          sed 's/=\(.*\)/: "\1"/' .env > env.yaml

      - name: Deploy to Cloud Run
        if: (github.event_name == 'push' && steps.filter.outputs.backend == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deploy_image == true)
        run: |
          gcloud beta run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/jobify-api/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --ports="http1=8080,h2c=9090" \
            --allow-unauthenticated \
            --env-vars-file=env.yaml \
            --quiet
